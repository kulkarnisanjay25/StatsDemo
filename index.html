<script>

function bc(a,b,x){const F=1e-30,qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<F)d=F;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;const l=d*c;h*=l;if(Math.abs(l-1)<3e-9)break}return h}

/* ---------- data ---------- */
let C=[],fish,webUrl='',wins=[{id:'s',t:'Session'},{id:'w',t:'Worksheet 1'}],cur='s',gid=0,xr=0,sess='';

for(let i=df.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[df[i],df[j]]=[df[j],df[i]]}

for(let i=0;i<100;i++){const m=Math.floor(r()*3),t=150+r()*40;mc.push('M'+(m+1));dia.push((10+[0,.05,.12][m]+(i==40?.35:0)+(i>=75?.1:0)+nz()*.08).toFixed(3));tp.push(t.toFixed(1));yl.push((20+.4*t+nz()*2).toFixed(2))}

function fromAoa(a){a=a.filter(r=>r.some(x=>x!==''&&x!=null));if(!a.length)throw Error('No data found');const w=Math.max(...a.map(r=>r.length));return Array.from({length:w},(_,j)=>({n:String(a[0][j]||'C'+(j+1)),d:a.slice(1).map(r=>String(r[j]??''))}))}

$('#main').addEventListener('input',e=>{const t=e.target.dataset;if(t.h!==undefined)C[+t.h].n=e.target.value;else if(t.c!==undefined){const d=C[+t.c].d,r=+t.r;while(d.length<r)d.push('');d[r]=e.target.value}});

/* ---------- dialogs ---------- */
function modal(t,b,run,keep){$('#dlg').innerHTML=`<div class=dt>${t}</div><div class=db>${b}</div><div class=df>${run?'<button id=ok>OK</button>':''}<button id=cn>${run?'Cancel':'Close'}</button></div>`;$('#ov').style.display='flex';$('#cn').onclick=()=>$('#ov').style.display='none';if(run)$('#ok').onclick=()=>{try{run();$('#ov').style.display='none'}catch(e){alert(e.message)}}}
function dlg(k,pre={}){const t=T[k],nc=numCols(),ac=C.map((_,i)=>i);let h='';

/* ---------- statistics ---------- */
function lin(x,y){const n=x.length,mx=mean(x),my=mean(y);let sxx=0,sxy=0,syy=0;x.forEach((a,i)=>{sxx+=(a-mx)**2;sxy+=(a-mx)*(y[i]-my);syy+=(y[i]-my)**2});const b1=sxy/sxx,b0=my-b1*mx;let sse=0,pr=0;x.forEach((a,i)=>{const e=y[i]-b0-b1*a,h=1/n+(a-mx)**2/sxx;sse+=e*e;pr+=(e/(1-h))**2});

function tests(v,cl,u,l){const a=[],b=[];let run=0,sd_=0;v.forEach((x,i)=>{if(x>u||x<l)a.push(i);const s=x>cl?1:x<cl?-1:0;if(s&&s==sd_)run++;else{run=s?1:0;sd_=s}if(run>=9)b.push(i)});return[a,b]}
function tout(nm,t,off=0){const m=['One point more than 3.00 standard deviations from center line.','9 points in a row on same side of center line.'];let s='Test Results for '+nm+'\n',any=0;t.forEach((a,i)=>{if(a.length){any=1;s+=`\nTEST ${i+1}. ${m[i]}\nTest Failed at points: ${a.map(j=>j+1+off).join(', ')}\n`}});return s+(any?'':'\nNo points failed the tests performed.')}
/* ---------- graphs ---------- */
function frame(o){const W=700,H=o.H||440,L=70,R=o.R||30,T=46,B=62,sx=v=>L+(v-o.x[0])/(o.x[1]-o.x[0])*(W-L-R),sy=v=>H-B-(v-o.y[0])/(o.y[1]-o.y[0])*(H-T-B);

s+=o.body(sx,sy);(o.xt||ticks(...o.x).map(v=>[v,fmtT(v)])).forEach(([v,t])=>s+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${H-B}" y2="${H-B+4}" stroke="#555"/><text x="${sx(v)}" y="${H-B+16}" text-anchor="middle">${esc(t)}</text>`);
(o.yt||ticks(...o.y).map(v=>[v,fmtT(v)])).forEach(([v,t])=>s+=`<line x1="${L-4}" x2="${L}" y1="${sy(v)}" y2="${sy(v)}" stroke="#555"/><text x="${L-7}" y="${sy(v)+4}" text-anchor="end">${t}</text>`);

return s+`<text x="${(L+W-R)/2}" y="${H-12}" text-anchor="middle" font-size="12" font-weight="600">${esc(o.xl||'')}</text><text transform="translate(16 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600">${esc(o.yl||'')}</text></svg>`}
function edges(a){const mn=Math.min(...a),mx=Math.max(...a),k=Math.ceil(1+Math.log2(a.length)),raw=((mx-mn)||1)/k,p=10**Math.floor(Math.log10(raw)),m=raw/p,st=(m<1.5?1:m<3?2:m<7?5:10)*p,s0=Math.floor(mn/st+1e-9)*st,e=[+s0.toPrecision(12)];let x=s0;while(x<=mx+1e-9){x+=st;e.push(+x.toPrecision(12))}return e}
const cnt=(a,ed)=>ed.slice(1).map((h,i)=>a.filter(x=>x>=ed[i]&&x<h).length),ymx=(a,ed,fit)=>Math.max(...cnt(a,ed),fit&&a.length>1&&sd(a)>0?a.length*(ed[1]-ed[0])/(sd(a)*2.5066):0);

body:(sx,sy)=>{let s='',pt=[];e.forEach(([k,c],i)=>{cum+=c;s+=`<rect x="${sx(i+.08)}" y="${sy(c)}" width="${sx(.84)-sx(0)}" height="${sy(0)-sy(c)}" fill="#5b9bd5" stroke="#1f4e79"/><text x="${sx(i+.5)}" y="${sy(c)-4}" text-anchor="middle">${c}</text>`;pt.push([sx(i+1),sy(cum)])});

function csvg(o){const v=o.v,n=v.length,f=o.off||0,lo=Math.min(...v,o.lcl),hi=Math.max(...v,o.ucl),d=(hi-lo)*.08;
return frame({title:o.title,H:300,R:95,x:[.5+f,n+.5+f],y:[lo-d,hi+d],xl:o.xl,yl:o.yl,body:(sx,sy)=>{let s='';const X=sx(n+.5+f)+4;

function openFile(){if(!window.XLSX)return alert('Excel reader could not load (no internet). Use File > Open from web link, or paste data into the worksheet.');const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=async()=>{try{load(wb2c(XLSX.read(await i.files[0].arrayBuffer(),{type:'array'})))}catch(e){alert('Could not read file: '+e.message)}};i.click()}
async function refresh(){if(!webUrl)return alert('No web link set. Use File > Open from web link first.');try{const r=await fetch(webUrl);if(!r.ok)throw Error('HTTP '+r.status);load(wb2c(XLSX.read(await r.text(),{type:'string'})))}catch(e){alert('Could not load link: '+e.message)}}
async function enc(o){const b=new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function dec(t){const b=Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
async function share(){try{const u=location.href.split('#')[0].split('?')[0]+'#d='+await enc({c:C,f:fish});try{navigator.clipboard.writeText(u)}catch(e){}modal('Share link',`<p>Send this link to trainees (WhatsApp, email). They will see exactly this worksheet and fishbone. Link copied to clipboard.</p><textarea rows=5 readonly style="width:100%" onclick="this.select()">${u}</textarea><p>Length: ${u.length} characters. For very large data use File &gt; Open from web link instead.</p>`)}catch(e){alert('Could not create link: '+e.message)}}
